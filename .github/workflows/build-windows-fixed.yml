name: Build Windows EXE Fixed

on:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/package/**'
      - 'Build-EXE-Select-Icon.bat'
      - '.github/workflows/build-windows-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'buildsrc/package/build_lite.part*.b64' | Sort-Object Name
          if ($parts.Count -lt 2) { throw 'Source package parts are missing.' }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('buildsrc/build_lite.rebuilt.zip', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path work,out | Out-Null
          Expand-Archive -LiteralPath 'buildsrc/build_lite.rebuilt.zip' -DestinationPath work -Force
          if (-not (Test-Path 'work/src/Darwin2WorklistBridgeApp.cs')) { throw 'Main source file was not reconstructed.' }

      - name: Download fo-dicom
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/fo-dicom.Desktop/4.0.8' -OutFile fo-dicom.zip
          Expand-Archive -LiteralPath fo-dicom.zip -DestinationPath fo-dicom -Force
          $dicom = Get-ChildItem -Path fo-dicom -Recurse -Filter Dicom.Core.dll | Where-Object { $_.FullName -match 'net45' } | Select-Object -First 1
          if (-not $dicom) { throw 'Dicom.Core.dll net45 was not found.' }
          Copy-Item -LiteralPath $dicom.FullName -Destination out\Dicom.Core.dll

      - name: Compile EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = @('C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe','C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw '.NET Framework C# compiler was not found.' }
          & $compiler /nologo /target:winexe /optimize+ /platform:anycpu /out:out\Darwin2WorklistBridge.exe /win32icon:work\assets\Darwin2WorklistBridge.ico /win32manifest:work\src\Darwin2WorklistBridge.manifest /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Management.dll /reference:System.Security.dll /reference:System.Web.Extensions.dll /reference:System.Windows.Forms.dll /reference:out\Dicom.Core.dll work\src\Darwin2WorklistBridgeApp.cs work\src\DicomTagSynchronization.cs work\src\DicomTagSyncForm.cs work\src\FeatureLicense.cs work\src\PacsReports.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compiler failed: $LASTEXITCODE" }
          if (-not (Test-Path 'out/Darwin2WorklistBridge.exe')) { throw 'EXE was not created.' }
          $fileVersion = (Get-Item 'out/Darwin2WorklistBridge.exe').VersionInfo.FileVersion
          if ($fileVersion -notlike '1.4.2*') { throw "Unexpected file version: $fileVersion" }

      - name: Validate BAT and package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bat = Get-Content -LiteralPath 'Build-EXE-Select-Icon.bat' -Raw
          if (($bat.ToCharArray() | Where-Object { [int]$_ -gt 127 }).Count -ne 0) { throw 'BAT contains non-ASCII characters.' }
          $bat = $bat -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'out\Build-EXE-Select-Icon.bat'), $bat, [Text.Encoding]::ASCII)
          Copy-Item 'work\assets\Darwin2WorklistBridge.ico' 'out\Darwin2WorklistBridge.ico'
          [IO.File]::WriteAllText((Join-Path $PWD 'out\VERSION.txt'), "Darwin2 Worklist Bridge 1.4.2`r`n", (New-Object Text.UTF8Encoding($true)))
          Compress-Archive -Path out\* -DestinationPath Darwin2WorklistBridge-1.4.2-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darwin2WorklistBridge-1.4.2-Windows
          path: Darwin2WorklistBridge-1.4.2-Windows.zip
          if-no-files-found: error
